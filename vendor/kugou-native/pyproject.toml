[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kugou-native-mcp"
version = "0.1.0"
description = "Local MCP tools for the official KuGou Windows client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "yuan-yannick"}]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "mcp>=1.30,<2",
  "websocket-client>=1.9,<2",
  "uiautomation>=2.0.29,<3; sys_platform == 'win32'",
]

[project.scripts]
kugou-mcp = "kugou_native_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/yuan-yannick/kugou-native-mcp"
Issues = "https://github.com/yuan-yannick/kugou-native-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kugou_native_mcp = ["bridge.js"]
